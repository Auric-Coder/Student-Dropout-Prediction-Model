services:
  - type: web
    name: student-dropout-predictor
    runtime: python
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 app:app
    healthCheckPath: /
    autoDeployTrigger: commit
